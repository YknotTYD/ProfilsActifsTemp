services:
  web:
    container_name: profilsactifs
    build: .
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:8080"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .git/
            - .venv/
            - db.sqlite3
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock