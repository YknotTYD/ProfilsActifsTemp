[project]
name = "competences-plus"
version = "0.1.0"
description = "Compétences+ — outil de valorisation des compétences mettant en relation candidats et recruteurs"
readme = "README.md"
authors = [
    { email = "pierre.maciejewski@epitech.eu" }
]
requires-python = ">=3.14"
dependencies = [
    "colorlog>=6.12.0",
    "django>=6.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
competences-plus = "competences_plus:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
