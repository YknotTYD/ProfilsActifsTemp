<div class="feed mt-5">
  {% for vid, liked, disliked, is_link in videos_ld %}
  <div class="feed-item">
    {% if is_link %}
    <iframe
      src="{{ vid.url }}?autoplay=1&mute=1&playsinline=1&controls=0"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; encrypted-media"
      allowfullscreen
    ></iframe>
    {% else %}
        <video src="{{ vid.file.url }}" autoplay muted playsinline loop></video>
    {% endif %}
    <div class="feed-caption">
      <a href="/profile/{{ vid.user }}/"><strong>@{{ vid.user }}</strong></a>
    </div>
    <div class="feed-actions">
      <button
        class="feed-react-btn react-btn {% if liked %}is-active-like{% endif %}"
        data-video-id="{{ vid.id }}"
        data-reaction="like"
      >
        <span class="feed-react-icon">👍</span>
        {% if role == "Admin" %}<span>{{ vid.likes|default:0 }}</span>{% endif %}
      </button>
      <button
        class="feed-react-btn react-btn {% if disliked %}is-active-dislike{% endif %}"
        data-video-id="{{ vid.id }}"
        data-reaction="dislike"
      >
        <span class="feed-react-icon">👎</span>
        {% if role == "Admin" %}<span>{{ vid.dislikes|default:0 }}</span>{% endif %}
      </button>
      {% if role == "Recruiter" %}
      <form method="post" action="/messages/start/" class="feed-message-form">
        {% csrf_token %}
        <input type="hidden" name="recipient" value="{{ vid.user }}">
        <button type="submit" class="feed-react-btn" title="Contacter @{{ vid.user }}">
          <span class="feed-react-icon">✉️</span>
        </button>
      </form>
      {% endif %}
    </div>
  </div>
  {% endfor %}
</div>
