{% load static %}

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Créer un compte - ProfilsActifs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral:ital@1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>
  <body>
    {% include "partials/_navbar.html" %}
    <div class="auth-page">
      <div class="card">
        <h1 class="card-title">Créer votre compte</h1>
        {% if error %}
        <p
          class="text-center"
          style="color: var(--color-secondary); margin-bottom: 14px"
        >
          {{ error }}
        </p>
        {% endif %}
        <form
          method="post"
          action="/api/register/"
          id="signup"
          class="grid gap-[14px]"
        >
          {% csrf_token %}
          <div class="field">
            <input
              id="reg-username"
              name="username"
              type="text"
              autocomplete="username"
              value="{{ username }}"
              placeholder=" "
              required
              class="peer field-input"
            />
            <label for="reg-username" class="field-label"
              >Nom d'utilisateur</label
            >
          </div>
          <div class="field">
            <input
              id="reg-password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder=" "
              required
              class="peer field-input"
            />
            <label for="reg-password" class="field-label">Mot de passe</label>
          </div>
          <div>
            <label for="reg-role" class="field-select-label">Vous êtes</label>
            <select
              id="reg-role"
              name="is_recruiter"
              required
              class="field-select"
            >
              <option value="0">Demandeur d'emploi</option>
              <option value="1">Recruteur</option>
            </select>
          </div>
          <button type="submit" id="signup-submit" class="btn-primary mt-2">
            CRÉER MON COMPTE
          </button>
        </form>
        <div class="foot">
          Vous avez déjà un compte ? <a href="/login/">Se connecter</a>
        </div>
      </div>
    </div>
    {% include "partials/_footer.html" %}
  </body>
</html>
