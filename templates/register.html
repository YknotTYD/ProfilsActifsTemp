{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

REGISTER

<form method="post" action="/api/register/">
{% csrf_token %}
  <label>Nom: 
    <input name="username" autocomplete="name" />
  </label><br>
  <label>Mot de passe:
    <input name="password" type="password" autocomplete="new-password" />
  </label><br>
  <label>Statut:
    <select name="is_recruiter">
      <option value="0">Demandeur d'emploi</option>
      <option value="1">Recruteur</option>
    </select>
  </label><br>
  <button>Sauvegarder</button>
</form>

<br>

<a href="/">back</a>

</body>
</html>
