<form id="video-file-form" enctype="multipart/form-data">
    <div class="p-field">
        <label>Titre</label>
        <input type="text" name="title" placeholder="Ma presentation" required>
    </div>
    <div class="p-field">
        <label>Description</label>
        <textarea name="description" placeholder="Description (facultatif)"></textarea>
    </div>
    <div class="p-field">
        <label>Fichier video</label>
        <input type="file" name="file" accept=".mp4,.mov,.avi,.webm" required>
    </div>
    <button type="submit" class="p-btn p-primary" style="margin-top:.5rem">
        Soumettre a la moderation
    </button>
</form>
<p id="video-file-status" class="p-muted" style="margin-top:.5rem"></p>

<script>
document.getElementById('video-file-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const status = document.getElementById('video-file-status');
    const csrftoken = document.querySelector('meta[name="csrf-token"]').content;
    status.textContent = 'Envoi en cours...';

    fetch('/api/profiles/me/videos/file/', {
        method: 'POST',
        body: formData,
        headers: { 'X-CSRFToken': csrftoken },
    })
    .then(response => response.json().then(data => ({ ok: response.ok, data })))
    .then(({ ok, data }) => {
        if (ok) {
            status.textContent = 'Video envoyée, en attente de modération.';
            form.reset();
        } else {
            status.textContent = 'Erreur : ' + (data.error || data.detail || 'inconnue');
        }
    })
    .catch(() => { status.textContent = 'Erreur réseau.'; });
});
</script>
