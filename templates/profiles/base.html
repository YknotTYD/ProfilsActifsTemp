{% load static %}{% load versioned_static %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Profils{% endblock %} — ProfilsActifs</title>
    <link rel="stylesheet" href="{% vstatic 'style.css' %}">
    <link rel="stylesheet" href="{% vstatic 'profiles.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    {% block head %}{% endblock %}
</head>
<body class="p-body">
    {% include "partials/_navbar.html" %}

    <main class="p-main">
        {% block content %}{% endblock %}

    {% include "partials/_footer.html" %}

    {% block scripts %}{% endblock %}
</body>
</html>
