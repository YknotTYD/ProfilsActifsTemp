{% load static %}{% load versioned_static %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Profils{% endblock %} — Compétences+</title>
    <link rel="stylesheet" href="{% vstatic 'style.css' %}">
    <link rel="stylesheet" href="{% vstatic 'profiles.css' %}">
    <link rel="stylesheet" href="{% vstatic 'certifications.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    {% block head %}{% endblock %}
<link rel="icon" type="image/x-icon" href="{% vstatic 'logo.svg' %}">
</head>
<body class="p-body">
    {% include "partials/_navbar.html" %}

    <main class="p-main" id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/_footer.html" %}

    {% block scripts %}{% endblock %}
</body>
</html>
