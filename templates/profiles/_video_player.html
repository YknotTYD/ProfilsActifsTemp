<div class="p-video-player">
  {% if player.mode == "iframe" and player.url %}
  <iframe
    src="{{ player.url }}"
    title="{{ title|default:'Video de presentation' }}"
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen
  ></iframe>
  {% elif player.url %}
  <video src="{{ player.url }}" controls playsinline preload="metadata"></video>
  {% else %}
  <p class="p-muted">Le lien de cette video est indisponible.</p>
  {% endif %}
</div>
