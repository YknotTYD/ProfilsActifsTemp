{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Questionnaires{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'questionnaires.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body class="q-body">
    <header class="q-header">
        <a class="q-brand" href="/">JibJob</a>
        <nav>
            <a href="/questionnaires/">Questionnaires</a>
            {% if can_manage %}<a href="/questionnaires/manage/">Administration</a>{% endif %}
            <a href="/logout">Deconnexion</a>
        </nav>
    </header>

    <main class="q-main">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'questionnaire_common.js' %}"></script>
    <script src="{% static 'questionnaire_fields.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
