name: Build

on:
  push:
    branches: '**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    env:
      DEMO_PASSWORD: Demo1234!
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Generate build-only secret key
        run: |
          SECRET_KEY=$(uv run python -c 'import secrets; print(secrets.token_urlsafe(50))')
          echo "DJANGO_SECRET_KEY=$SECRET_KEY" >> .env
    
      - name: Django system check
        run: uv run python manage.py check

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Seed demo accounts
        run: uv run python manage.py seed_demo

      - name: Collect static files
        run: uv run python manage.py collectstatic --noinput

      - name: Write demo accounts summary
        run: |
          {
            echo "# Comptes de demonstration"
            echo
            echo "Ces comptes sont deja crees dans \`db.sqlite3\`, pret a l'emploi."
            echo "Un profil complet par role ci-dessous ; 15 autres comptes de"
            echo "demonstration (12 candidats, 2 recruteurs supplementaires) sont"
            echo "deja crees avec le meme mot de passe, pour la recherche et les"
            echo "questionnaires."
            echo
            echo "| Role | Utilisateur | Mot de passe |"
            echo "|------|-------------|---------------|"
            echo "| Admin | admin_demo | $DEMO_PASSWORD |"
            echo "| Recruiter | julie.marchand | $DEMO_PASSWORD |"
            echo "| JobSeeker | camille.dubois | $DEMO_PASSWORD |"
            echo " "

            echo "la clé secrete dans le .env est généré aléatoirement lors de la demo ce n'est pas une vraie"

            echo "# Lancement"
            echo "./setup run (port)"
          } | tee DEMO_ACCOUNTS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Remove bytecode caches before packaging
        run: find . -name "__pycache__" -type d -prune -exec rm -rf {} +

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: profilsactifs-build-${{ github.sha }}
          include-hidden-files: true
          path: |
            manage.py
            profils
            templates
            static
            collectstatic
            db.sqlite3
            pyproject.toml
            uv.lock
            package.json
            package-lock.json
            Dockerfile
            compose.yaml
            setup
            README.md
            DEMO_ACCOUNTS.md
            .env
          retention-days: 30
          if-no-files-found: error
